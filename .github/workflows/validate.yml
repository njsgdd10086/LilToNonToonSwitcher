name: 校验包结构

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: 检查 Unity 包结构
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验 package.json、必要文件与 .meta
        shell: bash
        run: python3 scripts/validate_package.py --root .

      - name: 检查是否误提交个人路径
        shell: bash
        run: |
          set -euo pipefail
          if grep -rInE "deepseek_harness|VRChatCreatorCompanion|AppData" \
               --include="*.cs" --include="*.md" --include="*.json" . ; then
            echo "发现疑似个人路径，请清理后再提交"
            exit 1
          fi
          echo "未发现个人路径"
