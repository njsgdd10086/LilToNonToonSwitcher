name: 发布

# 只负责打包 + 创建 Release。
# VPM 索引由独立仓库 njsgdd10086/vpm-listing 统一生成：
#   https://njsgdd10086.github.io/vpm-listing/index.json
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的标签（例如 v1.0.0）'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: 打包并创建 Release
    runs-on: ubuntu-latest
    outputs:
      zipname: ${{ steps.meta.outputs.zipname }}
    steps:
      - uses: actions/checkout@v4

      - name: 校验版本与包结构
        id: meta
        shell: bash
        run: python3 scripts/validate_package.py --root . --tag "${{ github.ref_name }}" --github-output

      - name: 生成 VPM 包压缩包
        shell: bash
        run: |
          set -euo pipefail
          ZIP="${{ steps.meta.outputs.zipname }}"
          # VPM / VCC 要求 zip 根目录直接是包内容（package.json、Editor/ 等）
          zip -r -9 "$ZIP" . -x '.git/*' '.github/*' 'scripts/*' '.gitignore' '.gitattributes' '*.zip' '*.unitypackage'
          echo "=== 前 18 项 ==="
          unzip -l "$ZIP" | head -20
          unzip -l "$ZIP" | grep -q 'package.json' || { echo "压缩包里没有 package.json"; exit 1; }
          unzip -l "$ZIP" | grep -q 'Editor/NonToonConverter.cs' || { echo "压缩包里缺少源码"; exit 1; }
          unzip -l "$ZIP" | grep -q 'Editor/NonToonConverter.cs.meta' || { echo "压缩包里缺少 meta"; exit 1; }

      - name: 创建 Release 并上传
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ZIP="${{ steps.meta.outputs.zipname }}"
          VERSION="${{ steps.meta.outputs.version }}"
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          fi

          ls -l "$ZIP"

          # 用 API 判断 release 是否存在，避免 gh release view 的返回值影响后续分支
          if gh api "repos/$REPO/releases/tags/$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，覆盖上传附件"
            gh release upload "$TAG" "$ZIP" --clobber
          else
            echo "创建 Release $TAG"
            if [ -f ".github/RELEASE_NOTES.md" ]; then
              gh release create "$TAG" "$ZIP" --title "LilToNonToon Switcher $VERSION" --notes-file ".github/RELEASE_NOTES.md"
            else
              gh release create "$TAG" "$ZIP" --title "LilToNonToon Switcher $VERSION" --generate-notes
            fi
          fi

          # 确认附件真的挂上去了，否则这一步直接失败
          ASSETS=$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[].name')
          echo "Release 附件：$ASSETS"
          echo "$ASSETS" | grep -qx "$ZIP" || { echo "附件 $ZIP 未上传成功"; exit 1; }
          echo "Release $TAG 已发布并带附件"
