name: 发布

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的标签（例如 v1.0.0）'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: 打包并创建 Release
    runs-on: ubuntu-latest
    outputs:
      zipname: ${{ steps.meta.outputs.zipname }}
    steps:
      - uses: actions/checkout@v4

      - name: 校验版本与包结构
        id: meta
        shell: bash
        run: python3 scripts/validate_package.py --root . --tag "${{ github.ref_name }}" --github-output

      - name: 生成 VPM 包压缩包
        shell: bash
        run: |
          set -euo pipefail
          ZIP="${{ steps.meta.outputs.zipname }}"
          # VPM / VCC 要求 zip 根目录直接是包内容（package.json、Editor/ 等）
          zip -r -9 "$ZIP" . -x '.git/*' '.github/*' 'scripts/*' '.gitignore' '.gitattributes' '*.zip' '*.unitypackage'
          echo "=== 前 18 项 ==="
          unzip -l "$ZIP" | head -20
          unzip -l "$ZIP" | grep -q 'package.json' || { echo "压缩包里没有 package.json"; exit 1; }
          unzip -l "$ZIP" | grep -q 'Editor/NonToonConverter.cs' || { echo "压缩包里缺少源码"; exit 1; }
          unzip -l "$ZIP" | grep -q 'Editor/NonToonConverter.cs.meta' || { echo "压缩包里缺少 meta"; exit 1; }

      - name: 创建 Release 并上传
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ZIP="${{ steps.meta.outputs.zipname }}"
          VERSION="${{ steps.meta.outputs.version }}"
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          fi

          ls -l "$ZIP"

          # 用 API 判断 release 是否存在，避免 gh release view 的返回值影响后续分支
          if gh api "repos/$REPO/releases/tags/$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，覆盖上传附件"
            gh release upload "$TAG" "$ZIP" --clobber
          else
            echo "创建 Release $TAG"
            if [ -f ".github/RELEASE_NOTES.md" ]; then
              gh release create "$TAG" "$ZIP" --title "LilToNonToon Switcher $VERSION" --notes-file ".github/RELEASE_NOTES.md"
            else
              gh release create "$TAG" "$ZIP" --title "LilToNonToon Switcher $VERSION" --generate-notes
            fi
          fi

          # 确认附件真的挂上去了，否则这一步直接失败
          ASSETS=$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[].name')
          echo "Release 附件：$ASSETS"
          echo "$ASSETS" | grep -qx "$ZIP" || { echo "附件 $ZIP 未上传成功"; exit 1; }
          echo "Release $TAG 已发布并带附件"

  vpm-repo:
    name: 更新 VPM 仓库索引（gh-pages）
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 准备 gh-pages 工作目录
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pages
          cd pages
          git init -q
          git checkout -q -b gh-pages
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"

      - name: 由 Release 资产生成索引
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/releases?per_page=100" > releases.json
          python3 scripts/make_vpm_repo.py \
            --releases releases.json \
            --repository "${{ github.repository }}" \
            --output-dir pages
          echo "=== vpm.json ==="
          cat pages/vpm.json

      - name: 推送到 gh-pages
        shell: bash
        run: |
          set -euo pipefail
          cd pages
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "chore: 更新 VPM 索引" || echo "无变化"
          git push -f origin gh-pages
          echo "gh-pages 已更新"
